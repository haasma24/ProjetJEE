<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Comptes</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/css/style2.css}">
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-success" href="#">BankApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cards}">Cards</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/operations}">Operations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/accounts}">Accounts</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/credits}">Credits</a></li>
                <form th:action="@{/logout}" method="post" onsubmit="return confirmLogout();">
                    <button type="submit" class="nav-link text-danger" style="border: none; background: none;">Logout</button>
                </form>

                <script>
                    function confirmLogout() {
                        return confirm("Are you sure you want to logout?");
                    }
                </script>


                <!--                <li class="nav-item"><a class="nav-link text-danger" th:href="@{/logout}">Logout</a></li>-->
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h1>Liste des Comptes</h1>

    <div th:if="${comptes == null or cartes.isEmpty()}" class="alert-custom">
        Aucun compte disponible pour le moment.
    </div>

    <table class="table table-dark table-striped" th:if="${comptess != null and not cartes.isEmpty()}">
    <thead>
        <tr>
            <th>ID</th>
            <th>Numéro</th>
            <th>Solde</th>
            <th>Client</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="compte : ${comptes}">
            <td th:text="${compte.id}"></td>
            <td th:text="${compte.numero}"></td>
            <td th:text="${compte.solde}"></td>
            <td th:text="${compte.client.nom}"></td>
            <td>
                <a th:href="@{/editCompte(id=${compte.id})}" class="button">Modifier</a>
                <a th:href="@{/deleteCompte(id=${compte.id})}" class="button">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/formCompte" class="button">Ajouter un nouveau Compte</a>
</div>
</body>
</html>
