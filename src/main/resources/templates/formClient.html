<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulaire Client</title>
    <link rel="stylesheet" href="/css/css/style3.css">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-success" href="#">BankApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cards}">Cards</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/operations}">Operations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/accounts}">Accounts</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/credits}">Credits</a></li>
                <form th:action="@{/logout}" method="post" onsubmit="return confirmLogout();">
                    <button type="submit" class="nav-link text-danger" style="border: none; background: none;">Logout</button>
                </form>

                <script>
                    function confirmLogout() {
                        return confirm("Are you sure you want to logout?");
                    }
                </script>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h1 th:text="${client?.id == null ? 'Ajouter un Client' : 'Modifier le Client'}"></h1>

    <form th:action="@{/saveClient}" th:object="${client}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="nom">Nom :</label>
            <input type="text" th:field="*{nom}" class="input-field" required />
        </div>

        <div class="form-group">
            <label for="prenom">Prénom :</label>
            <input type="text" th:field="*{prenom}" class="input-field" required />
        </div>

        <div class="form-group">
            <label for="email">Email :</label>
            <input type="email" th:field="*{email}" class="input-field" required />
        </div>

        <div class="form-group">
            <label for="telephone">Téléphone :</label>
            <input type="text" th:field="*{telephone}" class="input-field" required />
        </div>

        <div class="button-group">
            <button type="submit" class="button">Enregistrer</button>
            <a href="/clients" class="button">Retour à la liste</a>
        </div>
    </form>
</div>
</body>
</html>
