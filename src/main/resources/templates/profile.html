<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil Utilisateur</title>
    <link rel="stylesheet" th:href="@{/css/css/styleProfile.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-success" href="#">BankApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cards}">Cards</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/operations}">Operations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/accounts}">Accounts</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/credits}">Credits</a></li>
                <form th:action="@{/logout}" method="post" onsubmit="return confirmLogout();">
                    <button type="submit" class="nav-link text-danger" style="border: none; background: none;">Logout</button>
                </form>

                <script>
                    function confirmLogout() {
                        return confirm("Are you sure you want to logout?");
                    }
                </script>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center">Profil Utilisateur</h2>
        <div class="row">
            <!-- Colonne gauche : Avatar + Infos de base -->
            <div class="col-md-4 text-center">
                <img th:src="@{/images/avatar.png}" class="rounded-circle mb-3" alt="Avatar">
                <h4 th:text="${user.firstName} + ' ' + ${user.lastName}"></h4>
                <p class="text-muted" th:text="${user.email}"></p>
            </div>

            <!-- Colonne droite : Détails utilisateur -->
            <div class="col-md-8">
                <ul class="list-group">
                    <li class="list-group-item"><strong>Nom:</strong> <span th:text="${user.lastName}"></span></li>
                    <li class="list-group-item"><strong>Prénom:</strong> <span th:text="${user.firstName}"></span></li>
                    <li class="list-group-item"><strong>Email:</strong> <span th:text="${user.email}"></span></li>
<!--                    <li class="list-group-item"><strong>Rôle:</strong> <span th:text="${user.roles}"></span></li>-->
<!--                    <li class="list-group-item"><strong>Date d'inscription:</strong> <span th:text="${user.createdAt}"></span></li>-->
                </ul>
            </div>
        </div>

        <!-- Boutons d'action -->
        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary">Retour à l'accueil</a>
            <a href="/users/edit" class="btn btn-warning">Modifier Profil</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
