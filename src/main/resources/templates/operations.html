<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Opérations</title>
    <link rel="stylesheet" th:href="@{/css/css/style2.css}">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-success" href="#">BankApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cards}">Cards</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/operations}">Operations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/accounts}">Accounts</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/credits}">Credits</a></li>
                <form th:action="@{/logout}" method="post" onsubmit="return confirmLogout();">
                    <button type="submit" class="nav-link text-danger" style="border: none; background: none;">Logout</button>
                </form>

                <script>
                    function confirmLogout() {
                        return confirm("Are you sure you want to logout?");
                    }
                </script>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h1>Liste des Opérations</h1>



    <div th:if="${operations == null or operations.isEmpty()}" class="alert-custom">
        Aucune Opération disponible pour le moment.
    </div>

    <table class="table table-dark table-striped" th:if="${operations!= null and not operations.isEmpty()}">

        <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Montant</th>
            <th>Date</th>
            <th>Compte</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="operation : ${operations}">
            <td th:text="${operation.id}"></td>
            <td th:text="${operation.type}"></td>
            <td th:text="${operation.montant}"></td>
            <td th:text="${operation.date}"></td>
            <td th:text="${operation.compte.numero}"></td>
            <td>
                <a th:href="@{/deleteOperation(id=${operation.id})}">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/formOperation" class="button">Ajouter une nouvelle Opération</a>
</div>
</body>
</html>
