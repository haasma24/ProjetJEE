<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulaire Compte</title>
    <link rel="stylesheet" href="/css/css/style3.css">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-success" href="#">BankApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cards}">Cards</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/operations}">Operations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/accounts}">Accounts</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/credits}">Credits</a></li>
                <form th:action="@{/logout}" method="post" onsubmit="return confirmLogout();">
                    <button type="submit" class="nav-link text-danger" style="border: none; background: none;">Logout</button>
                </form>

                <script>
                    function confirmLogout() {
                        return confirm("Are you sure you want to logout?");
                    }
                </script>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h1 th:text="${compte?.id == null ? 'Ajouter un Compte' : 'Modifier le Compte'}"></h1>

    <form th:action="@{/saveCompte}" th:object="${compte}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="numero">Numéro :</label>
            <input type="text" th:field="*{numero}" class="input-field" required />
        </div>

        <div class="form-group">
            <label for="solde">Solde :</label>
            <input type="number" step="0.01" th:field="*{solde}" class="input-field" required />
        </div>

        <div class="form-group">
            <label for="client">Client :</label>
            <select th:field="*{client.id}" class="input-field">
                <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.nom}"></option>
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="button">Enregistrer</button>
            <a href="/comptes" class="button">Retour à la liste</a>
        </div>
    </form>
</div>
</body>
</html>
